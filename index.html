<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Appreciation</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    text-align:center;
}

h2{
    color:#009688;
}

p{
    color:#555;
}

button{
    width:100%;
    padding:16px;
    margin:12px 0;
    font-size:17px;
    font-weight:bold;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
}

.regular{background:#2196F3;}
.breakdown{background:#FF9800;}
.accident{background:#E53935;}
.warranty{background:#4CAF50;}

button:hover{
    opacity:0.9;
}
</style>

</head>

<body>

<div class="container">

<h2>Customer Appreciation</h2>

<p>Please select the service you received.</p>

<button class="regular" onclick="sendMessage(regularMsg)">
🚗 Regular Vehicle Service
</button>

<button class="breakdown" onclick="sendMessage(breakdownMsg)">
🛠 Breakdown Vehicle
</button>

<button class="accident" onclick="sendMessage(accidentMsg)">
💥 Accidental Vehicle
</button>

<button class="warranty" onclick="sendMessage(warrantyMsg)">
🔧 Warranty Part Replacement
</button>

<br><br>

<small>
It takes less than 10 seconds to share your valuable feedback.<br>
Thank you for choosing VIDA.
</small>

</div>

<script>

const phone="918956547596";

const regularMsg=`I would like to sincerely appreciate the excellent service experience I received during my vehicle’s regular service. The entire process was handled in a very professional and systematic manner.

I was particularly impressed with the detailed inspection of the vehicle, including the physical checkpoints and necessary software update checks. The service team took the time to explain the service activities, vehicle condition, and important observations clearly, which gave me confidence that my vehicle was being properly taken care of.

I truly appreciate the team’s attention to detail, technical knowledge, transparency, and customer-friendly approach. The overall service experience was smooth, informative, and satisfying.

Thank you, VIDA Team, for your continuous support and for ensuring that my vehicle remains in good condition. I look forward to receiving the same excellent service in the future.

Best Regards,`;

const warrantyMsg=`Dear VIDA Team,

I would like to express my gratitude to the VIDA Service Team for the prompt and hassle-free warranty part replacement for my vehicle.

The entire process was handled professionally, and the required part was replaced without any inconvenience. The team was supportive, transparent, and ensured that my vehicle was ready as quickly as possible.

Thank you for providing such a pleasant service experience. I truly appreciate your efforts.

Best Regards,`;

const breakdownMsg=`I would like to express my sincere appreciation to the VIDA Service Team for the excellent support provided in resolving the technical issue with my vehicle.

From the moment I reported the concern, the team handled everything with professionalism, patience, and genuine commitment. They carefully listened to my issue, kept me informed throughout the process, and worked diligently to identify and resolve the problem efficiently.

What impressed me the most was their technical expertise, transparent communication, and customer-first approach. They took the time to explain the issue in a simple and reassuring manner, ensuring that I was confident and satisfied with the resolution.

Thanks to their prompt response and dedicated efforts, my vehicle is now performing perfectly, and I can ride with complete peace of mind. It is reassuring to know that VIDA has such a knowledgeable and dependable service team that truly cares about its customers.

A heartfelt thank you to the entire VIDA Service Team for your outstanding support, commitment, and professionalism. Your dedication to delivering a great customer experience is highly appreciated and has strengthened my trust in the VIDA brand. Keep up the excellent work!

est Regards,`;

const accidentMsg=`Dear VIDA Team,

I would like to thank the VIDA Service Team for the excellent support provided after my vehicle met with an accident.

The team handled the repair process professionally, arranged the required parts promptly, and restored my vehicle in excellent condition.

Throughout the process, I was kept informed, which gave me confidence and peace of mind.

I truly appreciate the team's dedication and customer-focused approach.

Thank you for the wonderful support.

Best Regards,`;

function sendMessage(message){

const url="https://wa.me/"+phone+"?text="+encodeURIComponent(message);

window.open(url,"_blank");

}

</script>

</body>
</html>
