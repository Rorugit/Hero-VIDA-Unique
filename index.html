<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Appreciation</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    text-align:center;
}

h2{
    color:#009688;
}

p{
    color:#555;
}

button{
    width:100%;
    padding:16px;
    margin:12px 0;
    font-size:17px;
    font-weight:bold;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
}

.regular{background:#2196F3;}
.breakdown{background:#FF9800;}
.accident{background:#E53935;}
.warranty{background:#4CAF50;}

button:hover{
    opacity:0.9;
}
</style>

</head>

<body>

<div class="container">

<h2>Customer Appreciation</h2>

<p>Please select the service you received.</p>

<button class="regular" onclick="sendMessage(regularMsg)">
🚗 Regular Vehicle Service
</button>

<button class="breakdown" onclick="sendMessage(breakdownMsg)">
🛠 Breakdown Vehicle
</button>

<button class="accident" onclick="sendMessage(accidentMsg)">
💥 Accidental Vehicle
</button>

<button class="warranty" onclick="sendMessage(warrantyMsg)">
🔧 Warranty Part Replacement
</button>

<br><br>

<small>
It takes less than 10 seconds to share your valuable feedback.<br>
Thank you for choosing VIDA.
</small>

</div>

<script>

const phone="918956547596";

const regularMsg=`I would like to sincerely appreciate the excellent service experience I received during my vehicle’s regular service. The entire process was handled in a very professional and systematic manner.

I was particularly impressed with the detailed inspection of the vehicle, including the physical checkpoints and necessary software update checks. The service team took the time to explain the service activities, vehicle condition, and important observations clearly, which gave me confidence that my vehicle was being properly taken care of.

I truly appreciate the team’s attention to detail, technical knowledge, transparency, and customer-friendly approach. The overall service experience was smooth, informative, and satisfying.

Thank you, VIDA Team, for your continuous support and for ensuring that my vehicle remains in good condition. I look forward to receiving the same excellent service in the future.

Best Regards,`;

const warrantyMsg=`I would like to sincerely appreciate the excellent support provided by the VIDA Service Team during the warranty replacement of the required vehicle part.

The entire process was handled very professionally and smoothly. The team clearly explained the issue, warranty replacement process, and the work carried out on my vehicle. I really appreciate the prompt coordination, technical expertise, and transparent communication throughout the process.

The replacement was completed efficiently, and the team ensured that the vehicle was properly checked before handing it back to me. Their supportive and customer-focused approach made the entire experience hassle-free and reassuring.

Thank you, VIDA Team, for your excellent support and commitment to customer satisfaction. I truly appreciate the service provided and look forward to the same level of support in the future.
Best Regards,`;

const breakdownMsg=`I would like to sincerely appreciate the excellent support provided by the VIDA Service Team in resolving the technical issue with my vehicle.

The team responded promptly, understood the issue carefully, and carried out a detailed diagnosis to identify the root cause. I really appreciate the technical knowledge and expertise of the service team in resolving the issue efficiently.

The team also kept me informed about the diagnosis and the work carried out, and explained the issue and solution clearly. Their professional approach, timely communication, and continuous support made the entire experience smooth and reassuring.

I am very satisfied with the way my vehicle was attended to and the technical issue was resolved. Thank you, VIDA Team, for your excellent support and commitment to providing a reliable and customer-focused service experience.
est Regards,`;

const accidentMsg=`Dear VIDA Team,

I would like to thank the VIDA Service Team for the excellent support provided after my vehicle met with an accident.

The team handled the repair process professionally, arranged the required parts promptly, and restored my vehicle in excellent condition.

Throughout the process, I was kept informed, which gave me confidence and peace of mind.

I truly appreciate the team's dedication and customer-focused approach.

Thank you for the wonderful support.

Best Regards,`;

function sendMessage(message){

const url="https://wa.me/"+phone+"?text="+encodeURIComponent(message);

window.open(url,"_blank");

}

</script>

</body>
</html>
